<?xml version="1.0" encoding="UTF-8"?>
<!-- VPN Gate client - main application icon.
     Rounded squircle with the calm blue-to-teal brand gradient and a
     white security shield with a check mark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b3a6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shade)"/>

  <!-- shield -->
  <g filter="url(#soft)">
    <path d="M64 24 L99 36.4 V64.2 C99 87.4 85.6 101.4 64 109.6
             C42.4 101.4 29 87.4 29 64.2 V36.4 Z"
          fill="#ffffff"/>
  </g>

  <!-- check mark -->
  <path d="M49.5 64.5 L59.5 75 L80.5 53.5"
        fill="none" stroke="#0d9488" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
